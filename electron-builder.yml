# Configuração de empacotamento do Mermaid Studio
appId: com.igorvac.mermaidstudio
productName: Mermaid Studio
copyright: © 2026 Igor Vac

directories:
  output: release
  buildResources: build

files:
  - dist/**
  - dist-electron/**
  - package.json

npmRebuild: false

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  darkModeSupport: false
  # Para auto-update funcionar no macOS o app PRECISA ser assinado e notarizado.
  # Defina as variáveis CSC_LINK / CSC_KEY_PASSWORD / APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID
  # no ambiente (local ou GitHub Actions secrets). Sem elas o build sai sem assinatura.
  hardenedRuntime: true
  gatekeeperAssess: false

dmg:
  title: 'Mermaid Studio ${version}'

# Mesmo OWNER/REPO de electron/updater.ts. O repositório precisa ser PÚBLICO
# para o auto-update funcionar sem token nos apps instalados.
publish:
  provider: github
  owner: igorvac
  repo: mermaidEditor
