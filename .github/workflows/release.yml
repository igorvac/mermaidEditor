# A cada push na main: incrementa a versão patch, builda o app macOS e publica
# uma GitHub Release. O app instalado detecta a release e oferece atualização.
#
# Segredos opcionais para assinatura/notarização (obrigatórios para o
# auto-update instalar sozinho no macOS):
#   CSC_LINK, CSC_KEY_PASSWORD  -> certificado Developer ID (.p12 em base64)
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID -> notarização
name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    # ignora os commits de bump de versão feitos pelo próprio workflow
    if: "!contains(github.event.head_commit.message, '[skip release]')"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testes
        run: npm test

      - name: Bump de versão (patch)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version patch -m "chore: release v%s [skip release]"
          git push --follow-tags

      - name: Build do renderer (vite)
        run: npm run build:renderer

      - name: Build do processo main (esbuild)
        run: npm run build:electron

      - name: Empacotar (electron-builder)
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # secrets ausentes viram strings vazias e confundem o electron-builder;
          # sem certificado/notarização as variáveis não podem existir
          [ -z "$CSC_LINK" ] && unset CSC_LINK CSC_KEY_PASSWORD
          [ -z "$APPLE_ID" ] && unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          set -o pipefail
          npx electron-builder --mac --publish never 2>&1 | tee /tmp/electron-builder.log

      # Publicação via gh em uma única chamada: o publisher embutido do
      # electron-builder pode criar releases duplicadas na mesma tag (corrida
      # entre uploads), o que quebra as URLs de download e o auto-update.
      - name: Publicar release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release create "v$VERSION" \
            release/*.dmg release/*.zip release/*.blockmap release/latest-mac.yml \
            --repo "${{ github.repository }}" \
            --title "Mermaid Studio v$VERSION" \
            --notes "Release automática gerada a partir da branch main."

      - name: Remover releases incompletas (sem latest-mac.yml)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/releases" \
            --jq '.[] | select(([.assets[].name] | index("latest-mac.yml")) | not) | .id' |
          while read -r id; do
            echo "removendo release incompleta $id"
            gh api -X DELETE "repos/${{ github.repository }}/releases/$id"
          done

      - name: Expor erro como anotação (diagnóstico)
        if: failure()
        shell: bash
        run: |
          MSG=$(tail -c 900 /tmp/electron-builder.log 2>/dev/null | tr '\n' '~' | tr -s ' ')
          echo "::error title=electron-builder::${MSG:-sem log}"
